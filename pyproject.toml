[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mercedes-benz-pipeline"
version = "0.1.0"
description = "Auditable CPU regression and artifact delivery for the Mercedes-Benz Kaggle solution"
readme = "README.md"

requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4"]

[project.urls]
Repository = "https://github.com/cttsai1985/kaggle-mercedes-benz-solution-mlops"

[project.scripts]
mercedes = "mercedes.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
lab = ["jupyterlab>=4,<5", "nbconvert>=7,<8", "matplotlib>=3.10,<4"]
data = ["kaggle>=2,<3"]
tracking = ["mlflow-skinny>=3,<4"]
tracking-test = ["sqlalchemy>=2,<3", "alembic>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/mercedes"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
